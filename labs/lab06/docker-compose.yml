version: "3.8"

services:
  web:
    image: nginx:1.27-alpine
    container_name: web
    depends_on:
      - app
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    user: "nginx"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_DB: vulnapp
      POSTGRES_USER: vulnuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnuser -d vulnapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: python:3.11-alpine
    container_name: app
    depends_on:
      - db
    working_dir: /app
    volumes:
      - ./app:/app:ro
    command: ["python", "app.py"]
    environment:
      DEBUG: "false"
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      DB_URL: postgresql://vulnuser:${POSTGRES_PASSWORD}@db:5432/vulnapp
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 512m
    cpus: "1.0"
    expose:
      - "5000"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  db_data:

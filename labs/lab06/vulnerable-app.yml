version: "3.8"

services:
  vulnerable-web:
    image: nginx:1.27-alpine
    container_name: vulnerable-web
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backup:/var/backups:rw
    user: "nginx"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: on-failure:5
    pids_limit: 200
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - isolated

  debug-shell:
    image: alpine:3.20
    container_name: debug-shell
    command: ["sh", "-lc", "sleep infinity"]
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: on-failure:5
    pids_limit: 100
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - isolated

networks:
  isolated:
    driver: bridge
